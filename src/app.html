<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		%sveltekit.head%

		<script>
			try {
				// 1. If user previously chose dark, or if they haven't chosen but their device prefers dark
				if (
					localStorage.theme === 'dark' || 
					(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-text dark:bg-dark-bg dark:text-dark-text transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
