<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%

		<script>
			try {
				// 1. If user previously chose dark, or if they haven't chosen but their device prefers dark
				if (
					localStorage.theme === 'dark' || 
					(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
